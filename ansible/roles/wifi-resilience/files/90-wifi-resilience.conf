# Managed by ansible (inkframe wifi-resilience role).
# Connection-property defaults: apply to profiles that leave these at default.
[connection]
# NM default (4 retries) strands the box offline after a wifi flap —
# it fails with "no-secrets" and never tries again. 0 = retry forever.
connection.autoconnect-retries=0
# brcmfmac drops healthy associations with power save on. 2 = disable.
wifi.powersave=2
