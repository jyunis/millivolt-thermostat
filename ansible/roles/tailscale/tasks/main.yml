---
- name: Check if Tailscale is already installed
  command: which tailscale
  register: tailscale_installed
  ignore_errors: true
  changed_when: false

- name: Install Tailscale
  shell: curl -fsSL https://tailscale.com/install.sh | sh
  when: tailscale_installed.rc != 0

- name: Enable and start tailscaled
  systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale status
  command: tailscale status
  register: tailscale_status
  ignore_errors: true
  changed_when: false

- name: Print Tailscale auth instruction if not authenticated
  debug:
    msg: "Run 'sudo tailscale up' on the Pi and authenticate via the printed URL"
  when: "'Logged out' in tailscale_status.stdout or tailscale_status.rc != 0"
