---
- name: Update apt cache and upgrade packages
  apt:
    update_cache: true
    upgrade: full
    cache_valid_time: 3600

- name: Install system dependencies
  apt:
    name:
      - python3
      - python3-dev
      - python3-venv
      - python3-lgpio
      - git
      - curl
    state: present

- name: Install extra fonts
  apt:
    name: "{{ app_extra_fonts }}"
    state: present
  when: app_extra_fonts | length > 0

- name: Create persistent journal directory
  file:
    path: /var/log/journal
    state: directory
    mode: "2755"
    owner: root
    group: systemd-journal

- name: Create machine-id journal subdirectory
  file:
    path: "/var/log/journal/{{ ansible_machine_id }}"
    state: directory
    mode: "2755"
    owner: root
    group: systemd-journal

- name: Create journald drop-in directory
  file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Configure journald for persistent storage
  copy:
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=100M
      SystemMaxFileSize=25M
      MaxRetentionSec=2week
    dest: /etc/systemd/journald.conf.d/size-limit.conf
    mode: "0644"
  notify: restart journald

- name: Flush runtime journal to persistent storage
  command: journalctl --flush
  changed_when: false

# ── Swap: disable zram, use file-backed swap ──

- name: Disable zram generator
  copy:
    content: |
      # Disabled — using file-backed swap instead
    dest: /etc/systemd/zram-generator.conf
    mode: "0644"

- name: Check if zram0 is active
  command: cat /proc/swaps
  register: active_swaps
  changed_when: false

- name: Disable zram swap if active
  command: swapoff /dev/zram0
  when: "'zram0' in active_swaps.stdout"

- name: Create swap file
  command: "fallocate -l {{ swap_size_mb }}M /swapfile"
  args:
    creates: /swapfile

- name: Set swap file permissions
  file:
    path: /swapfile
    mode: "0600"
    owner: root
    group: root

- name: Check if swapfile is already active
  command: cat /proc/swaps
  register: swap_status
  changed_when: false

- name: Format swap file
  command: mkswap /swapfile
  when: "'swapfile' not in swap_status.stdout"

- name: Enable swap file
  command: swapon /swapfile
  when: "'swapfile' not in swap_status.stdout"

- name: Add swap file to fstab
  lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    regexp: "^/swapfile"
    state: present

# ── tmpfs overlays: reduce SD card writes ──

- name: Mount /tmp as tmpfs
  mount:
    path: /tmp
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,noatime,nosuid,nodev,size=150M"
    state: mounted

# mkinitramfs builds the whole initrd tree under /var/tmp; 25M was too
# small for the rpi kernels (upgrade to 6.18 failed with ENOSPC on the
# thermostat, 2026-09-17). tmpfs only consumes what is actually used.
- name: Mount /var/tmp as tmpfs
  mount:
    path: /var/tmp
    src: tmpfs
    fstype: tmpfs
    opts: "defaults,noatime,nosuid,nodev,size=200M"
    state: mounted

# ── Force fsck on every boot ──

- name: Detect boot cmdline path
  stat:
    path: /boot/firmware/cmdline.txt
  register: boot_firmware_cmdline

- name: Set cmdline path fact
  set_fact:
    cmdline_path: "{{ '/boot/firmware/cmdline.txt' if boot_firmware_cmdline.stat.exists else '/boot/cmdline.txt' }}"

- name: Read current cmdline
  slurp:
    src: "{{ cmdline_path }}"
  register: cmdline_content

- name: Append fsck.mode=force to cmdline
  lineinfile:
    path: "{{ cmdline_path }}"
    regexp: '^(.+)$'
    line: '\1 fsck.mode=force'
    backrefs: true
  when: "'fsck.mode=force' not in (cmdline_content.content | b64decode)"

# ── Hardware watchdog: auto-reboot on hang ──

- name: Load bcm2835_wdt watchdog module on boot
  copy:
    content: "bcm2835_wdt\n"
    dest: /etc/modules-load.d/watchdog.conf
    mode: "0644"

- name: Load watchdog module now
  modprobe:
    name: bcm2835_wdt
    state: present
  ignore_errors: true

- name: Create systemd system.conf drop-in directory
  file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"

- name: Configure systemd hardware watchdog
  copy:
    content: |
      [Manager]
      RuntimeWatchdogSec=15
    dest: /etc/systemd/system.conf.d/watchdog.conf
    mode: "0644"

# ── Kernel panic auto-reboot ──

- name: Auto-reboot on kernel panic after 10 seconds
  sysctl:
    name: kernel.panic
    value: "10"
    sysctl_file: /etc/sysctl.d/99-reboot-on-panic.conf
    state: present
    reload: true

- name: Set timezone
  community.general.timezone:
    name: America/Chicago

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Check if uv is installed
  stat:
    path: "/home/{{ app_user }}/.local/bin/uv"
  register: uv_installed

- name: Install uv
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  become_user: "{{ app_user }}"
  environment:
    HOME: "/home/{{ app_user }}"
  when: not uv_installed.stat.exists
