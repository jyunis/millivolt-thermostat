---
- name: Update apt cache and upgrade packages
  apt:
    update_cache: true
    upgrade: full
    cache_valid_time: 3600

- name: Install system dependencies
  apt:
    name:
      - python3
      - python3-dev
      - python3-venv
      - python3-lgpio
      - git
      - curl
      - fonts-dejavu
    state: present

- name: Create persistent journal directory
  file:
    path: /var/log/journal
    state: directory
    mode: "2755"
    owner: root
    group: systemd-journal

- name: Configure journald size limits
  copy:
    content: |
      [Journal]
      SystemMaxUse=100M
      SystemMaxFileSize=25M
      MaxRetentionSec=2week
    dest: /etc/systemd/journald.conf.d/size-limit.conf
    mode: "0644"
  notify: restart journald

- name: Set timezone
  community.general.timezone:
    name: America/Chicago

- name: Set hostname
  hostname:
    name: thermostat

- name: Check if uv is installed
  stat:
    path: "/home/{{ thermostat_user }}/.local/bin/uv"
  register: uv_installed

- name: Install uv
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  become_user: "{{ thermostat_user }}"
  environment:
    HOME: "/home/{{ thermostat_user }}"
  when: not uv_installed.stat.exists
