[project]
name = "thermostat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "luma.oled>=3.13.0",
    "Pillow>=11.1.0",
    "uvicorn[standard]>=0.34.0",
    "w1thermsensor>=2.3.0",
]

[project.optional-dependencies]
hardware = [
    "RPi.GPIO>=0.7.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
